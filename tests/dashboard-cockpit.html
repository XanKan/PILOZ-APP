<script src="../assets/js/modules/erp/erp-dashboard-cockpit.js"></script>
<script>
(async()=>{
 const checks=[],check=(label,value)=>checks.push([label,!!value]);
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const isAnalyticalCall=call=>['get_dashboard_command_center','get_dashboard_cockpit'].includes(call.name);
 try{
  PilozModern.renderRoute('dashboard',state);check('skeleton prioritaire sans blocage global',!!document.querySelector('.cockpit-shell.is-loading[aria-busy="true"]'));await wait(40);
  check('prénom réel affiché',main.textContent.includes('Bonjour Alex'));
  check('sélecteur avec toutes les périodes',document.querySelectorAll('.cockpit-period select')[0]?.options.length===10);
  check('comparaison disponible',document.querySelectorAll('.cockpit-period select')[1]?.options.length===3);
  check('comparaisons expliquées sans jargon N-1',main.textContent.includes('Juste avant (ex. juillet → juin)')&&main.textContent.includes('Mêmes dates l’année dernière')&&!main.textContent.includes('N-1'));
  check('dates de comparaison exactes affichées',main.textContent.includes('Référence utilisée : du 1 juin 2026 au 30 juin 2026'));
  check('quatre indicateurs maximum',document.querySelectorAll('.cockpit-kpi').length===4);
  check('valeurs financières serveur affichées',main.textContent.includes('42 000')&&main.textContent.includes('31 200')&&main.textContent.includes('8 450'));
  check('aucun undefined ou null visible',!main.textContent.includes('undefined')&&!main.textContent.includes('null'));
  check('graphique analytique et alternative accessible',document.querySelectorAll('.cockpit-chart-line').length===2&&!!document.querySelector('.cockpit-chart-table table'));
  check('prévision non garantie explicitée',main.textContent.includes('Montants attendus, non garantis'));
  check('prévisions semaine et mois affichées',main.textContent.includes('Semaine prochaine')&&main.textContent.includes('Mois prochain'));
  check('actions prioritaires concrètes',main.textContent.includes('FAC-2026-0042')&&main.textContent.includes('Relancer'));
  check('notifications limitées et blocs métier',document.querySelectorAll('.cockpit-notifications article').length===1&&main.textContent.includes('Stock et approvisionnement'));
  check('échéances avec actions directes',document.querySelectorAll('.cockpit-due-list article>div button').length===2&&main.textContent.includes('Retard moyen'));
  check('catalogue et stock enrichis',main.textContent.includes('Meilleure vente')&&main.textContent.includes('Valeur du stock'));
  PilozDashboardCockpit.openDueEmail('invoice-1');PilozDashboardCockpit.openDuePayment('invoice-1');
  check('relance et règlement contextuels',calls.some(call=>call.name==='dueEmail')&&calls.some(call=>call.name==='duePayment'));
  PilozDashboardCockpit.completeActivity('activity-1');PilozDashboardCockpit.showNotifications();
  check('agenda et notifications actionnables',calls.some(call=>call.name==='quickActivity'&&call.action==='complete')&&calls.some(call=>call.name==='notifications'));
  check('appel analytique unique coordonné',calls.filter(isAnalyticalCall).length===1);

  PilozDashboardCockpit.setChartMode('comparison');
  check('comparaison graphique limitée à deux séries',document.querySelectorAll('.cockpit-chart-line').length===2&&main.textContent.includes('Période comparée'));
  PilozDashboardCockpit.startCustomize();
  check('mode personnaliser explicite',!!document.querySelector('.cockpit-customizer')&&document.querySelectorAll('.cockpit-drag-handle').length===9);
  check('indicateurs et blocs triables dans le panneau',document.querySelectorAll('[data-customizer-type="metric"]').length===4&&document.querySelectorAll('[data-customizer-type="block"]').length===9);

  check('ordre des indicateurs modifiable dans le panneau',PilozDashboardCockpit.ui.draft.selected_metrics[0]==='collected'&&document.querySelector('[data-customizer-type="metric"]')?.dataset.customizerKey==='collected');
  PilozDashboardCockpit.ui.customDragType='block';PilozDashboardCockpit.ui.customDragKey='commercial';PilozDashboardCockpit.ui.customDropSide='before';PilozDashboardCockpit.customizerDrop({preventDefault(){}},'block','receivables');
  check('glisser-déposer des blocs disponible dans le panneau',PilozDashboardCockpit.ui.draft.block_order[0]==='commercial');

  check('mode personnaliser fermé après sauvegarde',!document.querySelector('.cockpit-customizer'));
  PilozDashboardCockpit.startCustomize();PilozDashboardCockpit.setDensity('compact');check('densité compacte configurable',document.querySelector('.cockpit-shell').classList.contains('density-compact'));PilozDashboardCockpit.cancelCustomize();
  check('annulation restaure la disposition',!document.querySelector('.cockpit-customizer')&&!document.querySelector('.cockpit-shell').classList.contains('density-compact'));
