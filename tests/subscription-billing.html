<script>
const checks=[];try{
 checks.push(['route abonnement rendue',PilozModern.renderRoute('settings',state)===true]);
 checks.push(['offre réelle affichée',main.textContent.includes('Piloz Pro')&&main.textContent.includes('Actif')]);
 checks.push(['carte masquée',main.textContent.includes('VISA ···· 4242')&&!main.textContent.includes('4242424242424242')]);

 checks.push(['facture réelle affichée',main.textContent.includes('PILOZ-2026-0001')&&main.textContent.includes('70,80')]);
 checks.push(['PDF Stripe disponible',document.querySelector('a[href="https://stripe.example/invoice.pdf"]')?.textContent.includes('Télécharger')]);

}catch(error){checks.push(['exécution',false,error.stack||error.message]);}
const failed=checks.filter(row=>!row[1]),result=document.getElementById('result');result.dataset.status=failed.length?'failed':'passed';result.textContent=failed.length?`Échec : ${failed.map(row=>row[0]+(row[2]?` (${row[2]})`:'')).join(', ')}`:`${checks.length}/${checks.length} contrôles abonnement réussis`;
