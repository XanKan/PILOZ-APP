<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thèmes de documents</title><link rel="stylesheet" href="../assets/css/document-themes.css"><style>#result{position:fixed;z-index:10;left:8px;top:8px;background:#fff;padding:8px}.test-host{width:900px;margin:50px auto}</style></head><body><div id="result">RUNNING</div><div class="test-host" id="host"></div><script src="../assets/js/modules/erp/document-theme-renderer.js"></script><script>
