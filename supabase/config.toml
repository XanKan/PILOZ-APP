# Configuration locale minimale pour lier ce dépôt au projet hébergé.
# Les secrets et l'identifiant du projet distant ne sont jamais stockés ici.
project_id = "PILOZ-APP"

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

# Les invitations et les réinitialisations doivent toujours revenir sur
# l'application publiée. Les URL d'administration restent explicitement
# autorisées pour les invitations de l'équipe interne Piloz.
[auth]
site_url = "https://app.piloz.fr"
additional_redirect_urls = [
  "https://app.piloz.fr",
  "https://app.piloz.fr/**",
  "https://admin.piloz.fr",
  "https://admin.piloz.fr/**"
]

# Conserver les protections MFA et les paramètres OTP de production lors d'un
# `supabase config push`. Sans ces valeurs, la CLI proposerait ses valeurs
# locales par défaut, moins strictes.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Modèle versionné de l'invitation Supabase Auth. Le même contenu est utilisé
# pour les invitations envoyées depuis l'application et le back-office.
[auth.email.template.invite]
subject = "Vous êtes invité(e) à rejoindre PILOZ"
content_path = "./supabase/templates/invite.html"

# Modèle versionné de récupération du mot de passe. Le bouton renvoie vers
# l'application publiée, qui reconnaît le jeton `recovery` et affiche le
# formulaire sécurisé de choix du nouveau mot de passe.
[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe PILOZ"
content_path = "./supabase/templates/recovery.html"

# Le stockage vectoriel n'est pas utilisé par Piloz et nécessite un plan
# Supabase payant. Le désactiver évite qu'un push de configuration tente de
# l'activer par défaut.
[storage.vector]
enabled = false

# Stripe signe lui-même chaque webhook. Cette route publique ne dépend donc
# pas d'un JWT Supabase ; la signature HMAC Stripe reste obligatoire.
[functions.stripe-webhook]
verify_jwt = false

# La page tarifs appelle ce point d'entrée avant la création du compte.
# Les offres, l'origine, le débit et le nombre de tentatives sont validés côté serveur.
[functions.stripe-public-checkout]
verify_jwt = false

# Formulaire public de piloz.fr. La fonction valide les champs et transmet le
# message via le fournisseur e-mail configuré côté serveur.
[functions.public-contact]
verify_jwt = false

# Contrôle d'accès applicatif authentifié. La fonction vérifie côté serveur
# l'appartenance à une entreprise et l'état réel de sa licence.
[functions.license-access]
verify_jwt = true

# Le même point d'entrée reçoit les callbacks OAuth signés par un state court.
# Les actions POST restent authentifiées manuellement dans la fonction.
[functions.external-integrations]
verify_jwt = false

# Génération authentifiée des paquets comptables figés et de leur manifeste.
[functions.accounting-export-package]
verify_jwt = true

# Le callback OAuth SUPER PDP est un GET public protégé par un state aléatoire,
# court, à usage unique et lié à l'entreprise. Les actions POST vérifient le JWT
# utilisateur et les permissions directement dans la fonction.
[functions.superpdp-oauth]
verify_jwt = false

# Cette fonction accepte soit un JWT utilisateur qu'elle valide elle-même,
# soit le secret serveur du worker SUPER PDP. Aucun appel anonyme n'est traité.
[functions.platform-connector]
verify_jwt = false
