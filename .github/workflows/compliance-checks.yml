name: Compliance checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify release metadata and static safety
        run: |
          node scripts/verify-release.mjs
          node tests/document-template-selection-static.cjs
          test "$(tr -d '\r\n' < CNAME)" = "app.piloz.fr"
          ! git ls-files | grep -E '(^|/)\.env($|\.)'
          ! rg -n -S 'service_role.*eyJ|SUPABASE_SERVICE_ROLE_KEY.*eyJ|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . --glob '!compliance/**' --glob '!docs/**' --glob '!.github/**'
      - name: Install isolated PGlite test dependency
        run: npm install --prefix "$RUNNER_TEMP/piloz-pglite" @electric-sql/pglite@0.5.4
      - name: Apply every migration and run the fiscal lifecycle
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/document-lifecycle-pglite.cjs
      - name: Verify platform administration isolation and audit
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/platform-admin-pglite.cjs
      - name: Verify dashboard metrics, RLS and preferences
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/dashboard-cockpit-pglite.cjs
      - name: Verify dashboard at production-scale volumes
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/dashboard-performance-pglite.cjs
      - name: Verify admin queries with 10k companies and 100k users
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/platform-admin-performance-pglite.cjs
      - name: Verify archive tamper detection
        run: node tests/fiscal-archive-verifier.mjs
      - name: Verify Stripe billing security contract
        run: |
          node tests/stripe-billing-static.cjs
          node tests/site-offer-static.cjs
      - name: Run browser suites
        run: |
          tests=(browser-tests.html api-response.html fiscal-domain.html electronic-invoice.html erp-smoke.html production-regression.html)
          for test in "${tests[@]}"; do
            output=$(google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --user-data-dir="$RUNNER_TEMP/chrome-${test}" --dump-dom "file://$PWD/tests/${test}")
            echo "$output" | grep 'data-status="passed"'
          done
      - name: Install isolated mobile browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/piloz-playwright" playwright-core@1.56.1
      - name: Verify dashboard in desktop and mobile viewports
        env:
          PILOZ_PLAYWRIGHT_ROOT: ${{ runner.temp }}/piloz-playwright/node_modules/playwright-core
        run: |
          export PILOZ_CHROME_PATH="$(command -v google-chrome)"
          test -x "$PILOZ_CHROME_PATH"
          node tests/run-html-tests.cjs tests/dashboard-cockpit.html
          node tests/run-html-tests.cjs tests/subscription-billing.html
          node tests/run-html-tests.cjs tests/site-offer-selection.html
          PILOZ_VIEWPORT_WIDTH=390 PILOZ_VIEWPORT_HEIGHT=844 node tests/run-html-tests.cjs tests/dashboard-cockpit.html
          PILOZ_VIEWPORT_WIDTH=390 PILOZ_VIEWPORT_HEIGHT=844 node tests/run-html-tests.cjs tests/subscription-billing.html
          PILOZ_VIEWPORT_WIDTH=390 PILOZ_VIEWPORT_HEIGHT=844 node tests/run-html-tests.cjs tests/site-offer-selection.html
