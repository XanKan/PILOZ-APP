name: Compliance checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify release metadata and static safety
        run: |
          node scripts/verify-release.mjs
          node tests/access-control-static.cjs
          node tests/accounting-item-types-static.cjs
          node tests/auth-extensions-accounting-static.cjs
          node tests/crm-command-center-static.cjs
          node tests/crm-sales-rework-static.cjs
          node tests/deposit-finalization-static.cjs
          node tests/document-template-selection-static.cjs
          node tests/document-visibility-static.cjs
          node tests/filter-layering-static.cjs
          node tests/navigation-multitab-static.cjs
          node tests/oauth-license-static.cjs
          node tests/platform-admin-mfa-static.cjs
          node tests/security-hardening-static.cjs
          node tests/settings-navigation-static.cjs
          node tests/site-offer-static.cjs
          node tests/stripe-billing-static.cjs
          test "$(tr -d '\r\n' < CNAME)" = "app.piloz.fr"
          ! git ls-files | grep -E '(^|/)\.env($|\.)'
          ! rg -n -S 'service_role.*eyJ|SUPABASE_SERVICE_ROLE_KEY.*eyJ|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . --glob '!compliance/**' --glob '!docs/**' --glob '!.github/**'
      - name: Install isolated PGlite test dependency
        run: npm install --prefix "$RUNNER_TEMP/piloz-pglite" @electric-sql/pglite@0.5.4
      - name: Apply every migration and run the fiscal lifecycle
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/document-lifecycle-pglite.cjs
      - name: Verify platform administration isolation and audit
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/platform-admin-pglite.cjs
      - name: Verify accounting fiscal maintenance and closure
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/accounting-fiscal-maintenance-pglite.cjs
      - name: Verify balanced accounting and multi-rate VAT
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/accounting-engine-pglite.cjs
      - name: Verify sales account types, grouping and discounts
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/sales-account-types-pglite.cjs
      - name: Verify dashboard metrics, RLS and preferences
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/dashboard-cockpit-pglite.cjs
      - name: Verify dashboard at production-scale volumes
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/dashboard-performance-pglite.cjs
      - name: Verify CRM sales rework, tenant isolation and document amounts
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: |
          node tests/crm-command-center-static.cjs
          node tests/crm-sales-rework-static.cjs
          node tests/crm-sales-rework-pglite.cjs
      - name: Verify remaining database-backed modules
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: |
          node tests/catalog-migration-pglite.cjs
          node tests/crm-command-center-pglite.cjs
          node tests/crm-performance-pglite.cjs
          node tests/document-themes.cjs
      - name: Verify admin queries with 10k companies and 100k users
        env:
          PILOZ_PGLITE_ROOT: ${{ runner.temp }}/piloz-pglite/node_modules/@electric-sql/pglite
        run: node tests/platform-admin-performance-pglite.cjs
      - name: Verify archive tamper detection
        run: node tests/fiscal-archive-verifier.mjs
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/piloz-playwright" playwright-core@1.56.1
      - name: Run the complete desktop browser suite
        env:
          PILOZ_PLAYWRIGHT_ROOT: ${{ runner.temp }}/piloz-playwright/node_modules/playwright-core
        run: |
          export PILOZ_CHROME_PATH="$(command -v google-chrome)"
          test -x "$PILOZ_CHROME_PATH"
          tests=(access-control.html api-response.html auth-guard.html browser-tests.html catalog-workspace.html client-workspace.html commercial-workflows.html commercial-workspace.html company-settings-smoke.html dashboard-cockpit.html document-viewer-v2.html due-actions.html electronic-invoice.html erp-smoke.html fiscal-domain.html navigation-smoke.html no-flicker.html production-regression.html scroll-preservation.html settings-overview.html site-offer-selection.html subscription-billing.html template-footer-smoke.html template-list-layout.html)
          for test in "${tests[@]}"; do
            node tests/run-html-tests.cjs "tests/${test}"
          done
      - name: Run critical mobile browser journeys
        env:
          PILOZ_PLAYWRIGHT_ROOT: ${{ runner.temp }}/piloz-playwright/node_modules/playwright-core
          PILOZ_VIEWPORT_WIDTH: 390
          PILOZ_VIEWPORT_HEIGHT: 844
        run: |
          export PILOZ_CHROME_PATH="$(command -v google-chrome)"
          tests=(dashboard-cockpit.html subscription-billing.html site-offer-selection.html client-workspace.html commercial-workspace.html document-viewer-v2.html catalog-workspace.html navigation-smoke.html)
          for test in "${tests[@]}"; do
            node tests/run-html-tests.cjs "tests/${test}"
          done
